name: dbt Ephemeral CI Pipeline

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Force full refresh (build all models)?'
        required: true
        type: boolean
        default: false

jobs:
  dbt_ci:
    runs-on: ubuntu-latest

    env:
      DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.DBT_SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}
      DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}
      DBT_SNOWFLAKE_ROLE: ${{ secrets.DBT_SNOWFLAKE_ROLE }}
      DBT_SNOWFLAKE_DATABASE: DEV_DB
      DBT_SNOWFLAKE_WAREHOUSE: ${{ secrets.DBT_SNOWFLAKE_WAREHOUSE }}
      DBT_SNOWFLAKE_SCHEMA: PR_${{ github.event.number }}_CI

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake

      - name: Create dbt profiles directory and file
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          HEALTHCARE_PLATFORM:
            outputs:
              ci:
                type: snowflake
                account: "${DBT_SNOWFLAKE_ACCOUNT}"
                user: "${DBT_SNOWFLAKE_USER}"
                password: "${DBT_SNOWFLAKE_PASSWORD}"
                role: "${DBT_SNOWFLAKE_ROLE}"
                database: "${DBT_SNOWFLAKE_DATABASE}"
                warehouse: "${DBT_SNOWFLAKE_WAREHOUSE}"
                schema: "${DBT_SNOWFLAKE_SCHEMA}"
                threads: 4
            target: ci
          EOF

      - name: Install dbt packages
        run: dbt deps

      - name: Download Production Manifest (for Slim CI)
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: dbt_prod_cd.yml
          name: prod-manifest
          path: ./state
          search_artifacts: true
        continue-on-error: true

      - name: Build & Test Models in DEV_DB
        run: |
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            echo "Manual full refresh requested. Running all models..."
            dbt build --target ci --full-refresh
          elif [ -f "./state/manifest.json" ]; then
            echo "Production manifest found! Running Slim CI (modified models and downstream dependents)..."
            dbt build --target ci --select state:modified+ --state ./state
          else
            echo "No production manifest found. Running full project build..."
            dbt build --target ci
          fi