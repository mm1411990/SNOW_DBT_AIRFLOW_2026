name: dbt Dynamic Ephemeral CI Pipeline

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  dbt_ci:
    runs-on: ubuntu-latest

    env:
      DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.DBT_SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}
      DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}
      DBT_SNOWFLAKE_ROLE: ${{ secrets.DBT_SNOWFLAKE_ROLE }}
      DBT_SNOWFLAKE_DATABASE: ${{ secrets.DBT_SNOWFLAKE_DATABASE }}
      DBT_SNOWFLAKE_WAREHOUSE: ${{ secrets.DBT_SNOWFLAKE_WAREHOUSE }}
      # Dynamic Ephemeral Schema based on GitHub PR Number
      DBT_SNOWFLAKE_SCHEMA: PR_${{ github.event.number }}_CI

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake

      - name: Create dbt profiles directory and file
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          HEALTHCARE_PLATFORM:
            outputs:
              ci:
                type: snowflake
                account: "${DBT_SNOWFLAKE_ACCOUNT}"
                user: "${DBT_SNOWFLAKE_USER}"
                password: "${DBT_SNOWFLAKE_PASSWORD}"
                role: "${DBT_SNOWFLAKE_ROLE}"
                database: "${DBT_SNOWFLAKE_DATABASE}"
                warehouse: "${DBT_SNOWFLAKE_WAREHOUSE}"
                schema: "${DBT_SNOWFLAKE_SCHEMA}"
                threads: 4
            target: ci
          EOF

      - name: Install dbt packages
        run: |
          dbt deps

      - name: Run isolated CI build in ephemeral schema
        run: |
          dbt build --target ci --full-refresh