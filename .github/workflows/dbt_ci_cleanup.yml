name: dbt Ephemeral CI Cleanup

on:
  pull_request:
    types: [closed]

jobs:
  cleanup_ci_schema:
    runs-on: ubuntu-latest

    env:
      DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.DBT_SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}
      DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}
      DBT_SNOWFLAKE_ROLE: ${{ secrets.DBT_SNOWFLAKE_ROLE }}
      DBT_SNOWFLAKE_DATABASE: ${{ secrets.DBT_SNOWFLAKE_DATABASE }}
      DBT_SNOWFLAKE_WAREHOUSE: ${{ secrets.DBT_SNOWFLAKE_WAREHOUSE }}
      DBT_SNOWFLAKE_SCHEMA: PR_${{ github.event.number }}_CI

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake

      - name: Create dbt profiles directory and file
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          HEALTHCARE_PLATFORM:
            outputs:
              ci:
                type: snowflake
                account: "${DBT_SNOWFLAKE_ACCOUNT}"
                user: "${DBT_SNOWFLAKE_USER}"
                password: "${DBT_SNOWFLAKE_PASSWORD}"
                role: "${DBT_SNOWFLAKE_ROLE}"
                database: "${DBT_SNOWFLAKE_DATABASE}"
                warehouse: "${DBT_SNOWFLAKE_WAREHOUSE}"
                schema: "${DBT_SNOWFLAKE_SCHEMA}"
                threads: 4
            target: ci
          EOF

      - name: Drop PR Schemas from Snowflake
        run: |
          dbt run-operation drop_schema --args "{schema_name: '${DBT_SNOWFLAKE_SCHEMA}'}" || true
          dbt run-operation drop_schema --args "{schema_name: '${DBT_SNOWFLAKE_SCHEMA}_SILVER'}" || true
          dbt run-operation drop_schema --args "{schema_name: '${DBT_SNOWFLAKE_SCHEMA}_GOLD'}" || true