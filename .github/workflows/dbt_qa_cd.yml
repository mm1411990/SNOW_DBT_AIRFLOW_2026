name: dbt QA Deployment (CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy_qa:
    runs-on: ubuntu-latest

    env:
      DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.DBT_SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}
      DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}
      DBT_SNOWFLAKE_ROLE: ${{ secrets.DBT_SNOWFLAKE_ROLE }}
      DBT_SNOWFLAKE_DATABASE: QA_DB
      DBT_SNOWFLAKE_WAREHOUSE: ${{ secrets.DBT_SNOWFLAKE_WAREHOUSE }}
      DBT_SNOWFLAKE_SCHEMA: PUBLIC

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake

      - name: Create dbt profiles directory and file
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          HEALTHCARE_PLATFORM:
            outputs:
              qa:
                type: snowflake
                account: "${DBT_SNOWFLAKE_ACCOUNT}"
                user: "${DBT_SNOWFLAKE_USER}"
                password: "${DBT_SNOWFLAKE_PASSWORD}"
                role: "${DBT_SNOWFLAKE_ROLE}"
                database: "${DBT_SNOWFLAKE_DATABASE}"
                warehouse: "${DBT_SNOWFLAKE_WAREHOUSE}"
                schema: "${DBT_SNOWFLAKE_SCHEMA}"
                threads: 4
            target: qa
          EOF

      - name: Install dbt packages
        run: dbt deps

      - name: Deploy & Build Models in QA_DB
        run: dbt build --target qa